version: "3.8"

services:
  cloudimgs:
    image: wuyuekiki/cloudimgs:main-amd64
    ports:
      - "3001:3001"
    volumes:
      - ./uploads:/app/uploads:rw # 上传目录配置，明确读写权限
    restart: unless-stopped
    container_name: cloudimgs-app
    environment:
      - PUID=1000  # 替换为您 NAS 用户的实际 ID (id -u)
      - PGID=1000   # 替换为您 NAS 用户组的实际 ID (id -g)
      - UMASK=002
      - NODE_ENV=production
      - PORT=3001
      - STORAGE_PATH=/app/uploads
      # 速率限制配置（可选）
      - UPLOAD_RATE_LIMIT=0   # 每分钟上传请求上限，0=不限制（默认300）
      # - LOGIN_RATE_LIMIT=10  # 每分钟登录请求上限（默认10，建议保留）
      # 密码保护配置（可选）
      # - PASSWORD=your_password_here
